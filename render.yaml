services:
  - type: web
    name: reelforge
    runtime: rust
    plan: free
    branch: main
    buildCommand: cargo build --release
    # Use cargo run so the binary path always resolves on Render's runtime FS
    startCommand: cargo run --release -- serve --port $PORT
    healthCheckPath: /login
    envVars:
      - key: RUST_LOG
        value: info
